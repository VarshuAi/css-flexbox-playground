<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox Playground — Glassmorphism Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-bg"></div>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-row">
                <span class="logo-emoji">🍱</span>
                <div class="title-col">
                    <h1>CSS Flexbox Playground</h1>
                    <p class="tagline">Tweak flex layouts, align items, and export responsive CSS.</p>
                </div>
            </div>
            <div class="badge">css</div>
        </header>

        <main class="workspace-card">
            
            <div style="display: flex; gap: 12px; margin-bottom: 16px;">
                <select id="flex-dir" style="background:var(--bg-secondary); color:#fff; border:1px solid var(--border); padding:8px; border-radius:8px;">
                    <option value="row">row</option>
                    <option value="column">column</option>
                </select>
                <select id="flex-jc" style="background:var(--bg-secondary); color:#fff; border:1px solid var(--border); padding:8px; border-radius:8px;">
                    <option value="flex-start">flex-start</option>
                    <option value="center">center</option>
                    <option value="space-between">space-between</option>
                </select>
            </div>
            <div id="flex-canvas" style="display:flex; height: 180px; background:#0c0c14; border:1px solid var(--border); border-radius:12px; padding:12px; gap:8px;">
                <div class="flex-box">1</div>
                <div class="flex-box">2</div>
                <div class="flex-box">3</div>
            </div>
        
        </main>
        
        <footer class="app-footer">
            <p>Created as a premium portfolio piece by <a href="https://github.com/VARSHAN69" target="_blank">@VARSHAN69</a></p>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
